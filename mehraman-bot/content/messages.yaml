ask_reminder: |
  دوست دارید هر روز یک یادآوری ملایم برای تمرین بفرستم؟ ساعت مناسب را انتخاب کنید (هر وقت خواستید تغییر یا خاموشش می‌کنید).
reminder_on: "⏰ یادآوری روزانه روی ساعت {time} تنظیم شد."
reminder_off: "یادآوری خاموش شد. هر وقت خواستید از «⏰ یادآوری» دوباره روشنش کنید."
reminder_bad: "ساعت را به شکل ۲۰:۳۰ بنویسید (۲۴ ساعته)، یا بنویسید: خاموش"
reminder_custom_ask: "ساعت دلخواه را بنویسید؛ مثلاً ۲۱:۱۵"
reminder:
