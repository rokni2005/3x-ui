# متن پیام‌های بازو (لحن مهرمان). هر کلید را می‌توان تغییر داد؛ فهرست = انتخاب تصادفی.
# جاگذاری‌ها: {name} {station} {time} {subtitle}
welcome: |
  سلام {name} جان، به خونه‌ی مهرمان خوش اومدید 🏡🌱

  من دستیار هوشمند مهرمانم؛ کنارتون هستم تا مسیر یادگیری‌تون رو قدم‌به‌قدم، با تمرین و یادآوری، دنبال کنیم و به سؤال‌هاتون در چارچوب محتوای مهرمان جواب بدم.

  چند نکته‌ی کوتاه:
  • من جای مشاور نیستم؛ جایی که لازم باشد، شما را به مشاوران مهرمان وصل می‌کنم.
  • گفتگوها فقط برای کمک به همین مسیر نگهداری می‌شوند و محرمانه‌اند. لطفاً نام و مشخصات هویتی‌تان یا اطلاعات بسیار شخصی را در متن آزاد ننویسید.
  • برای پاسخ‌دادن، متن پیام شما به یک سرویس هوش مصنوعی ارسال می‌شود.

  اگر موافقید، شروع کنیم؟
welcome_back: "سلام {name} جان 🌿 خوشحالم که برگشتید. از منوی پایین هر کدام را می‌خواهید انتخاب کنید."
menu_hint: "در خدمتم 🌿 از منوی پایین انتخاب کنید یا مستقیم بپرسید."
ask_station: |
  کدام ایستگاه از مسیر را شروع کنیم؟ اگر تازه آمده‌اید «۱» را بزنید؛ اگر قبلاً پیش رفته‌اید، ایستگاهی که اکنون در آن هستید را انتخاب کنید.
change_station: "ایستگاه جدید را انتخاب کنید:"
