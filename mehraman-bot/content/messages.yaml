help: |
  راهنما:
  📝 تمرین امروز — تمرین ایستگاه فعلی
  🧭 نقشه‌ی من — ایستگاه و پیشرفت شما
  ❓ هر پرسشی — مستقیم بنویسید
  🤝 ارتباط با مشاور — فرم کوتاه ارجاع
  ⏰ یادآوری — ساعت یادآوری روزانه
  /stations فهرست ایستگاه‌ها • /reset پاک‌کردن گفتگو • /cancel لغو
admin_help: |
  دستورهای ادمین:
  /stats [روز] — گزارش (کاربران، پرسش‌ها، چک‌این، موانع، پرسش‌های بی‌پاسخ)
  /reload — بارگذاری دوباره‌ی محتوا
  /sources — منابع محتوای پشتیبان
  /delknowledge نام‌فایل — حذف یک منبع
  ارسال فایل با کپشن /addknowledge (md/txt/docx) برای محتوای پشتیبان
  ارسال فایل با کپشن /addcontent (yaml) برای دوره یا کاربرگ
