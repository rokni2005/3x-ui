ask_prompt: "بفرمایید، گوش می‌کنم 🌿 پرسش‌تان را بنویسید."
out_of_scope: |
  این پرسش را با اطمینان در محتوای فعلی‌ام نمی‌یابم و نمی‌خواهم حدس بزنم. 🤍
  اگر مسئله‌ی مشخصی دارید، می‌توانید با مشاوران مهرمان در ارتباط باشید؛ پرسش‌تان را هم برای تکمیل محتوا ثبت کردم.
limit_reached: "امروز به سقف پرسش‌های روزانه رسیدیم 🌙 فردا با کمال میل ادامه می‌دهیم."
llm_error: "الان نتوانستم پاسخ بدهم؛ کمی بعد دوباره امتحان کنید 🙏"
error: "مشکلی پیش آمد؛ لطفاً دوباره تلاش کنید."
text_only: "فعلاً فقط پیام متنی را می‌توانم بخوانم 🌿"
history_cleared: "گفتگوی قبلی پاک شد."
refer_intro: |
  🤝 با کمال میل شما را به مشاور مهرمان وصل می‌کنم.

  چند پرسش کوتاه می‌پرسم تا مشاور مناسب تعیین شود و با شما تماس بگیرد. لطفاً نام کامل، شماره تلفن یا جزئیات هویتی دیگران را ننویسید؛ تماس از طریق همین پیام‌رسان انجام می‌شود.
refer_done: "ثبت شد 🤍 همکاران مهرمان به‌زودی از همین‌جا با شما در تماس خواهند بود. تا آن موقع مراقب خودتان باشید."
about: |
  🏡 مهرمان، خانه‌ی تخصصی خانواده است؛ جمعی از متخصصان خانواده که با نگاهی بومی و نقشه‌محور، خانواده‌ها را قدم‌به‌قدم در مسیر رشد همراهی می‌کنند: از آستانه‌ی خانه تا آجر به آجر ساختنِ رابطه‌ای آگاهانه‌تر و صمیمی‌تر.

  این بازو دستیار هوشمند است و جای مشاور نمی‌نشیند.

