# نمونه‌ی کاربرگ (فایل‌های با پیشوند _ بارگذاری نمی‌شوند). کپی کنید، نام را عوض کنید و پیشوند _ را بردارید.
id: s03-ws1                 # شناسه یکتا (انگلیسی/عدد)
station: s03                # شناسه ایستگاه در فایل دوره
title: چهار جمله‌ی روشن
purpose: جداکردن «اتفاق» از «برداشت» و «احساس»
minutes: 10
steps:
  - یک موقعیت کوچک و تازه از این هفته انتخاب کنید (نه بزرگ‌ترین دعوای زندگی).
  - اتفاق را بدون قضاوت بنویسید؛ مثل دوربین، فقط آنچه دیده و شنیده می‌شد.
  - برداشت خودتان از آن اتفاق را جداگانه بنویسید.
  - احساس‌تان را با یک یا دو واژه نام ببرید.
  - بنویسید در این موقعیت چه نیازی داشتید.
reflection: کدام بخش نوشتنش سخت‌تر بود؟
