id: communication
title: مهارت‌های ارتباط مؤثر در خانواده
# سطح «مقدماتی» = ایستگاه‌های ۱ تا ۵؛ «پیشرفته (مسیر آرامش)» = ایستگاه‌های ۶ تا ۱۵
stations:
  - {id: s01, order: 1, name: آستانه خانه, level: مقدماتی, subtitle: راهنمای شروع و نقشه‌ی مسیر, keywords: [شروع, نقشه, دوره]}
  - {id: s02, order: 2, name: معماری خانه, level: مقدماتی, subtitle: رابطه‌ای که می‌خواهیم بسازیم، از کجا شروع می‌شود؟, keywords: [هدف رابطه, مقصد, سهم من]}
  - {id: s03, order: 3, name: چراغ تشخیص, level: مقدماتی, subtitle: مشکل ما واقعاً چیست؟, keywords: [تشخیص مسئله, اتفاق, برداشت, احساس]}
  - {id: s04, order: 4, name: راهروی بن‌بست, level: مقدماتی, subtitle: چرا حرف‌زدنمان آخرش به دعوا می‌رسد؟, keywords: [دعوا, دفاع, حمله, سکوت, قهر]}
  - {id: s05, order: 5, name: پنجره شنیدن, level: مقدماتی, subtitle: شنیدی... اما آیا واقعاً فهمیدی؟, keywords: [گوش دادن, انعکاس, همدلی]}
