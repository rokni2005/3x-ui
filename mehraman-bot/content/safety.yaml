# قواعد ایمنی؛ بدون کد قابل ویرایش است.
# هشدار: شماره‌های زیر را پیش از انتشار با منبع رسمی تطبیق دهید.
emergency_message: |
  🤍 آنچه نوشتید برایم مهم است و نمی‌خواهم تنها بمانید.

  اگر خودتان یا کسی در خانه در خطر فوری است، همین حالا با یکی از این خطوط تماس بگیرید:
  • اورژانس اجتماعی: ۱۲۳
  • اورژانس: ۱۱۵
  • پلیس: ۱۱۰
  • مشاوره‌ی تلفنی بهزیستی: ۱۴۸۰

  اگر دوست دارید، همکاران مشاور مهرمان هم می‌توانند با شما در ارتباط باشند؛ دکمه‌ی زیر را بزنید.
